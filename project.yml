# XcodeGen spec for the iOS port.  Generate the Xcode project with:
#
#     brew install xcodegen
#     scripts/fetch_deps.sh            # downloads Boost / AngelScript / FreeType / libpng / msgpack into ThirdParty/
#     (place BASS for iOS in ThirdParty/bass/ - see docs/PORTING.md)
#     xcodegen generate && open Seaurchin.xcodeproj
#
# UNVERIFIED: this spec was written without access to Xcode.  Expect to adjust third-party
# source lists / header paths on the first build (docs/PORTING.md, "Verification status").
name: Seaurchin

options:
  bundleIdPrefix: com.example            # <- change
  deploymentTarget:
    iOS: "14.0"                          # GCKeyboard (hardware keyboards) needs iOS 14
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.example.seaurchin      # <- change
    DEVELOPMENT_TEAM: ""                                  # <- your Apple team id
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_CXX_LANGUAGE_STANDARD: gnu++17     # the code predates C++20 (e.g. its own lerp() would clash with std::lerp)
    CLANG_CXX_LIBRARY: libc++
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_BITCODE: NO

targets:
  SeaurchinCore:
    type: library.static
    platform: iOS
    sources:
      - path: Seaurchin
        excludes:
          - "Main.cpp"                 # Windows entry point (GameHost.cpp replaces it)
          - "Main.h"
          - "PrecompiledHeader.cpp"    # MSVC PCH creator
          - "*.vcxproj*"
          - "*.rc"
          - "resource.h"
      - path: Platform
        includes:
          - "SeaText.cpp"
          - "SeaPng.cpp"
          - "SeaTouchRouter.cpp"
          - "SeaKeyMap.cpp"
          - "DxCompat/DxCore.cpp"
      # --- third party, compiled from source (populated by scripts/fetch_deps.sh) ---
      - path: ThirdParty/angelscript/sdk/angelscript/source
        includes: ["*.cpp"]
        excludes: ["as_callfunc_*.cpp"]          # re-added below, see AS notes
      - path: ThirdParty/angelscript/sdk/angelscript/source
        includes: ["as_callfunc.cpp", "as_callfunc_arm64.cpp", "as_callfunc_arm.cpp"]
      - path: ThirdParty/angelscript/sdk/add_on/scriptarray
        includes: ["*.cpp"]
      - path: ThirdParty/angelscript/sdk/add_on/scriptmath
        includes: ["*.cpp"]
      - path: ThirdParty/angelscript/sdk/add_on/scriptstdstring
        includes: ["*.cpp"]
      - path: ThirdParty/angelscript/sdk/add_on/scriptdictionary
        includes: ["*.cpp"]
      - path: ThirdParty/boost/libs/filesystem/src
        includes: ["*.cpp"]
        excludes: ["windows_file_codecvt.cpp"]
      - path: ThirdParty/freetype-build           # generated by scripts/fetch_deps.sh (amalgamated FreeType unit)
      - path: ThirdParty/libpng
        includes: ["png.c", "pngerror.c", "pngget.c", "pngmem.c", "pngpread.c", "pngread.c", "pngrio.c",
                   "pngrtran.c", "pngrutil.c", "pngset.c", "pngtrans.c", "pngwio.c", "pngwrite.c", "pngwtran.c",
                   "pngwutil.c"]                    # plain C code paths; the NEON files need runtime CPU detection
    settings:
      base:
        GCC_PREFIX_HEADER: Seaurchin/PrecompiledHeader.h     # == MSVC's force-included PCH
        GCC_PRECOMPILE_PREFIX_HEADER: YES
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Seaurchin
          - $(SRCROOT)/Platform
          - $(SRCROOT)/ThirdParty/boost
          - $(SRCROOT)/ThirdParty/boost/libs/filesystem/src
          - $(SRCROOT)/ThirdParty/angelscript/sdk/angelscript/include
          - $(SRCROOT)/ThirdParty/angelscript/sdk/add_on
          - $(SRCROOT)/ThirdParty/freetype/include
          - $(SRCROOT)/ThirdParty/freetype-build      # ftmodule_sea.h
          - $(SRCROOT)/ThirdParty/libpng
          - $(SRCROOT)/ThirdParty/msgpack/include
          - $(SRCROOT)/ThirdParty/bass
        GCC_PREPROCESSOR_DEFINITIONS:
          - BOOST_FILESYSTEM_VERSION=3            # path::imbue / wstring() API the engine uses
          - BOOST_FILESYSTEM_STATIC_LINK=1
          - BOOST_ALL_NO_LIB=1
          - FT2_BUILD_LIBRARY=1
          - PNG_ARM_NEON_OPT=0
        OTHER_CPLUSPLUSFLAGS:
          - -Wno-c++11-narrowing                  # MSVC accepted double->float in braced initialisers; clang errors
          - -Wno-deprecated-declarations
          - -Wno-writable-strings

  Seaurchin:
    type: application
    platform: iOS
    sources:
      - path: Platform/iOS
        excludes: ["Info.plist"]
      - path: Resources                           # bundled as a folder reference -> <app>/Resources, staged to Documents/Data
        type: folder
        buildPhase: resources
    dependencies:
      - target: SeaurchinCore
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: UIKit.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
      - sdk: ImageIO.framework
      - sdk: CoreGraphics.framework
      - sdk: AudioToolbox.framework
      - sdk: libz.tbd
      # BASS for iOS ships as .xcframework (device + simulator slices).  scripts/fetch_bass.sh installs them and sets
      # `embed` to false only if the binary inside is a static archive.  (The real BASS 2.4 iOS package is dynamic: embed.)
      - framework: ThirdParty/bass/bass.xcframework
        embed: true
      - framework: ThirdParty/bass/bassmix.xcframework
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Platform/iOS/Info.plist
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Platform
          - $(SRCROOT)
        OTHER_LDFLAGS: [-lc++]
        OTHER_CPLUSPLUSFLAGS: [-Wno-c++11-narrowing]
