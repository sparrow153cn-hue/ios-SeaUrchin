name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # macos-latest is macos-26 (Xcode 26) since mid-2026.  This old code base is safer on the older Xcode 16
  # toolchain first; to try the newer one, change `runs-on` to macos-26 and XCODE_VERSION to 26.x.
  XCODE_VERSION: "16.4"

jobs:
  # ---------------------------------------------------------------------------------------------
  # Fast, cheap, and the only part of this pipeline that has actually been run: the platform-independent
  # code (DxLib replacement, touch router, text conversion, controller, font layout, PNG decoding).
  # ---------------------------------------------------------------------------------------------
  portable-tests:
    name: Portable tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++ make libpng-dev
      - run: make -C Tests test

  # ---------------------------------------------------------------------------------------------
  # Builds the app.  UNVERIFIED: expect to iterate on compile errors; build.log is always uploaded.
  # ---------------------------------------------------------------------------------------------
  ios:
    name: iOS app (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The only place the app name lives is the top-level `name:` in project.yml (change it with
      # scripts/rename_app.sh).  Project, scheme, .app, .ipa and artifact names all derive from it.
      - name: Read app name from project.yml
        run: |
          name=$(sed -n 's/^name:[[:space:]]*//p' project.yml | head -n1 | tr -d "\"'\r")
          test -n "$name" || { echo "::error::no top-level name: in project.yml"; exit 1; }
          echo "APP_NAME=$name" >> "$GITHUB_ENV"
          echo "App name: $name"

      - name: Select Xcode
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ -d "$app" ]; then sudo xcode-select -s "$app"; else echo "::warning::$app not found, using the default Xcode"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Boost/AngelScript/FreeType/libpng/msgpack sources (big, so cached).  BASS is deliberately not cached or committed.
      - name: Cache third-party sources
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ThirdParty
            !ThirdParty/bass
          key: thirdparty-${{ hashFiles('scripts/fetch_deps.sh') }}

      - name: Fetch third-party sources
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bash scripts/fetch_deps.sh

      - name: Fetch BASS (proprietary, downloaded at build time)
        env:
          BASS_IOS_URL: ${{ vars.BASS_IOS_URL }}
          BASSMIX_IOS_URL: ${{ vars.BASSMIX_IOS_URL }}
        run: |
          # empty repository variables must fall back to the script defaults
          [ -n "$BASS_IOS_URL" ] || unset BASS_IOS_URL
          [ -n "$BASSMIX_IOS_URL" ] || unset BASSMIX_IOS_URL
          bash scripts/fetch_bass.sh

      - name: Generate Xcode project
        run: xcodegen generate

      # Fails early and by name if a path the Xcode project references does not exist (an early Xcode failure
      # usually means exactly that).  Also prints the layout so a wrong guess is easy to correct.
      - name: Preflight - are all third-party paths where project.yml expects them?
        run: |
          missing=0
          need() { if [ ! -e "$1" ]; then echo "::error title=Missing path::$1"; missing=1; else echo "ok   $1"; fi; }
          need "${APP_NAME}.xcodeproj"
          need ThirdParty/angelscript/sdk/angelscript/source/as_context.cpp
          need ThirdParty/angelscript/sdk/angelscript/include/angelscript.h
          need ThirdParty/angelscript/sdk/add_on/scriptarray/scriptarray.h
          need ThirdParty/angelscript/sdk/add_on/scriptmath/scriptmath.h
          need ThirdParty/angelscript/sdk/add_on/scriptstdstring/scriptstdstring.h
          need ThirdParty/angelscript/sdk/add_on/scriptdictionary/scriptdictionary.h
          need ThirdParty/boost/boost/filesystem.hpp
          need ThirdParty/boost/libs/filesystem/src/path.cpp
          need ThirdParty/freetype/include/ft2build.h
          need ThirdParty/freetype-build/ft_amalgam.c
          need ThirdParty/libpng/png.c
          need ThirdParty/libpng/pnglibconf.h
          need ThirdParty/msgpack/include/msgpack.hpp
          need ThirdParty/bass/bass.h
          need ThirdParty/bass/bassmix.h
          need ThirdParty/bass/bass.xcframework
          need ThirdParty/bass/bassmix.xcframework
          asm=ThirdParty/angelscript/sdk/angelscript/source/as_callfunc_arm64_xcode.S
          if [ -e "$asm" ]; then echo "ok   $asm"; else
            echo "::warning title=AngelScript arm64 assembly::$asm not found (native calls on arm64 need it). callfunc files present: $(ls ThirdParty/angelscript/sdk/angelscript/source | grep -i callfunc | tr '\n' ' ')"
          fi
          if [ "$missing" != 0 ]; then
            echo "--- ThirdParty layout (2 levels) ---"; find ThirdParty -maxdepth 2 | sort | head -80
            exit 1
          fi

      # If header lookup is ever wrong again this shows what Xcode actually applied, and whether the runner's environment
      # injects include paths (CPATH & co.), without having to dig through the build log.
      - name: Diagnostics - header-related build settings
        run: |
          echo "--- environment variables that add include paths ---"
          env | grep -E "^(CPATH|CPLUS_INCLUDE_PATH|C_INCLUDE_PATH|OBJC_INCLUDE_PATH|SDKROOT|DEVELOPER_DIR|LIBRARY_PATH)=" || echo "(none)"
          echo "--- build settings per target ---"
          xcodebuild -project "${APP_NAME}.xcodeproj" -scheme "${APP_NAME}" -configuration Release -sdk iphoneos -showBuildSettings 2>/dev/null \
            | grep -E "^Build settings for action|^    (TARGET_NAME|SYSTEM_HEADER_SEARCH_PATHS|HEADER_SEARCH_PATHS|CLANG_ENABLE_MODULES|CLANG_CXX_LANGUAGE_STANDARD|GCC_PREFIX_HEADER|GCC_PRECOMPILE_PREFIX_HEADER|SDKROOT) = " \
            | cut -c1-400 || true

      # By default Xcode stops starting new compile jobs after the first failure, so each run shows only one file's
      # errors.  This preference makes it keep compiling the other files, so one run reports (nearly) all of them.
      # Harmless if xcodebuild ignores it.
      - name: Keep building after errors (report as many errors as possible per run)
        run: defaults write com.apple.dt.Xcode IDEBuildOperationContinueBuildingAfterErrors -bool YES

      - name: Build (device SDK, no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" -scheme "${APP_NAME}" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Report build errors (annotations + summary)
        if: always()
        run: |
          [ -f build.log ] || exit 0
          grep -E "error:|fatal error:|ld: |\*\* BUILD FAILED" build.log | sed 's/^[[:space:]]*//' | awk '!seen[$0]++' | head -60 > errors.txt || true
          # one annotation per error (GitHub shows at most 10 per step), message text escaped for the workflow-command syntax
          head -10 errors.txt | while IFS= read -r line; do
            esc=${line//'%'/'%25'}; esc=${esc//$'\r'/'%0D'}
            echo "::error title=Build error::${esc}"
          done
          tail -25 build.log | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' > tail.enc
          echo "::error title=Last 25 lines of build.log::$(cat tail.enc)"
          {
            echo "### Build errors (first 60 distinct)"; echo '```'; cat errors.txt; echo '```'
            echo "### Last 40 lines"; echo '```'; tail -40 build.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package unsigned IPA
        run: |
          app=$(find build/Build/Products -maxdepth 2 -name "${APP_NAME}.app" | head -n1)
          test -n "$app"
          rm -rf Payload && mkdir Payload && cp -R "$app" Payload/
          # BASS ships its frameworks as armv7 + armv7s + arm64 fat binaries.  The 32-bit slices are useless on any
          # iPhone from the last decade and are a known trouble spot for the re-signing done by sideloading tools
          # (e.g. LiveContainer): a framework that ends up with an invalid signature gets the whole process killed the
          # moment it is loaded.  Keep only the arm64 slice.
          for f in Payload/*.app/Frameworks/*.framework; do
            [ -d "$f" ] || continue
            b="$f/$(basename "$f" .framework)"
            if lipo -info "$b" 2>/dev/null | grep -q "Architectures in the fat file"; then
              lipo -thin arm64 "$b" -output "$b.arm64" && mv "$b.arm64" "$b"
              echo "thinned: $(lipo -info "$b")"
            fi
          done
          zip -qry "${APP_NAME}-unsigned.ipa" Payload

      # For "it builds but crashes on launch": shows whether the bundle is structurally sound (embedded frameworks,
      # the compiled Metal shader library, bundled Resources, what the executable links against and where it looks
      # for @rpath libraries).  Inspects the packaged copy (Payload/), i.e. exactly what goes into the IPA.  Written to
      # ipa-report.txt, which is uploaded in the same artifact as build.log.
      - name: Inspect app bundle (crash triage)
        if: always()
        run: |
          app=$(ls -d Payload/*.app 2>/dev/null | head -n1)
          [ -n "$app" ] || app=$(find build/Build/Products -maxdepth 2 -name "${APP_NAME}.app" 2>/dev/null | head -n1)
          if [ -z "$app" ]; then echo "no .app was built" > ipa-report.txt; exit 0; fi
          {
            echo "== app: $app"
            echo "== top level";            ls -la "$app"
            echo "== Frameworks";           ls -laR "$app/Frameworks" 2>&1
            echo "== metal libraries";      find "$app" -name "*.metallib" -exec ls -la {} \;
            echo "== Resources (2 levels)"; find "$app/Resources" -maxdepth 2 2>&1 | head -60
            exe="$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
            echo "== executable: $exe";     file "$exe"; lipo -info "$exe"
            echo "== header";               otool -hv "$exe"
            echo "== build version";        otool -l "$exe" | grep -A5 LC_BUILD_VERSION
            echo "== linked libraries";     otool -L "$exe"
            echo "== rpaths";               otool -l "$exe" | grep -A2 LC_RPATH
            echo "== code signature";       codesign -dv "$exe" 2>&1 || true
            for f in "$app"/Frameworks/*.framework; do
              [ -d "$f" ] || continue
              b="$f/$(basename "$f" .framework)"
              echo "== framework binary: $b"; file "$b"; lipo -info "$b"; otool -D "$b"; otool -L "$b" | head -12
            done
            echo "== Info.plist";           /usr/libexec/PlistBuddy -c 'Print' "$app/Info.plist" | head -40
          } > ipa-report.txt 2>&1 || true
          { echo "### App bundle report"; echo '```'; cat ipa-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: ${{ env.APP_NAME }}-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            ipa-report.txt
